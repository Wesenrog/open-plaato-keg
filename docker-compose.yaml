services:
  open_plaato_keg:
    image: ghcr.io/wesenrog/open-plaato-keg:latest
    container_name: open_plaato_keg
    ports:
      - 1234:1234
      - 8085:8085
    restart: always
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Persist keg data across container updates.
      # Unraid: change host path to /mnt/user/appdata/open-plaato-keg:/db
      - ./data:/db
    environment:
      - DATABASE_FILE_PATH=/db/keg_data.bin
      - KEG_LISTENER_PORT=1234
      - HTTP_LISTENER_PORT=8085
      # The auth tokens of your kegs, comma-separated, and/or a file with one
      # token per line. Neither set: any keg is accepted.
      - KEG_ALLOWED_IDS=
      # - KEG_ALLOWED_IDS_FILE=/db/allowed-ids
