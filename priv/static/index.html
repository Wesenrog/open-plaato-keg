<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serving</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    .serving-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    @media (min-width: 900px) and (orientation: landscape) {
      .serving-grid.count-2 { grid-template-columns: repeat(2, 1fr); }
      .serving-grid.count-3 { grid-template-columns: repeat(3, 1fr); }
    }
    .keg {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      min-height: 260px;
    }
    .keg-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .keg-name {
      font-size: 1.15rem;
      font-weight: 700;
      background: none;
      border: none;
      color: var(--text);
      padding: 0;
      width: 100%;
    }
    .keg-name::placeholder { color: var(--text-muted); font-weight: 500; }
    .keg-status { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .keg-temp { font-size: 0.9rem; color: var(--text-muted); }
    .keg-litres { font-size: 3.2rem; font-weight: 800; line-height: 1; }
    .keg-litres small { font-size: 1rem; font-weight: 600; color: var(--text-muted); margin-left: 0.3rem; }
    .keg-sub { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin: 0.5rem 0 0; }
    .keg-low { font-size: 0.85rem; font-weight: 700; color: var(--warn); margin-top: 0.4rem; }
    .keg-tare { border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .keg-tare .lbl { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .keg-tare .row { display: flex; gap: 0.5rem; }
    .keg-tare input { flex: 1; min-width: 0; }
    .pick-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .pick-bar .chip {
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .pick-bar .chip.on { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header data-nav="serving"></header>
  <main>
    <div class="pick-bar" id="pickBar" hidden>
      <span class="muted">Show:</span>
    </div>
    <div class="serving-grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No scales registered yet.</p>
  </main>

  <script src="/app.js"></script>
  <script>
    const MAX_KEGS = 3;       // scales shown at once
    const grid = qs("#grid");
    const emptyMsg = qs("#empty");
    const pickBar = qs("#pickBar");

    let kegs = new Map();     // id -> keg record
    let connected = new Set(); // connected ids
    let selection = loadSelection();

    function loadSelection() {
      try {
        const raw = localStorage.getItem("serving.selection");
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }
    function saveSelection() {
      try { localStorage.setItem("serving.selection", JSON.stringify(selection)); } catch (_) {}
    }

    function sortedIds() {
      return [...kegs.values()]
        .sort((a, b) => {
          const ao = a.my_sort_order == null || a.my_sort_order === "" ? 1e9 : parseInt(a.my_sort_order, 10);
          const bo = b.my_sort_order == null || b.my_sort_order === "" ? 1e9 : parseInt(b.my_sort_order, 10);
          if (ao !== bo) return ao - bo;
          return String(a.id).localeCompare(String(b.id));
        })
        .map((k) => k.id);
    }

    function visibleIds() {
      const all = sortedIds();
      if (selection && selection.length) {
        const filtered = all.filter((id) => selection.indexOf(id) !== -1);
        return filtered.slice(0, MAX_KEGS);
      }
      return all.slice(0, MAX_KEGS);
    }

    function renderPickBar() {
      const all = sortedIds();
      pickBar.hidden = all.length <= MAX_KEGS;
      if (pickBar.hidden) return;
      pickBar.querySelectorAll(".chip").forEach((c) => c.remove());
      const vis = visibleIds();
      all.forEach((id) => {
        const k = kegs.get(id);
        const chip = ce("span", "chip" + (vis.indexOf(id) !== -1 ? " on" : ""));
        chip.textContent = (k && k.my_label && k.my_label.trim()) || shortId(id);
        chip.onclick = () => toggleSelection(id);
        pickBar.appendChild(chip);
      });
    }

    function toggleSelection(id) {
      const base = selection && selection.length ? selection.slice() : visibleIds();
      const i = base.indexOf(id);
      if (i !== -1) base.splice(i, 1);
      else base.push(id);
      selection = base;
      saveSelection();
      render();
    }

    function shortId(id) {
      return "Scale " + String(id).slice(0, 8);
    }

    const LOW_LITRES = 2;
    let shown = "";           // ids of the cards in the grid, joined

    function kegCard(id) {
      const card = ce("div", "card keg");
      card.dataset.kegId = id;
      card.innerHTML =
        '<div class="keg-top">' +
          '<input class="keg-name" maxlength="40" />' +
          '<span class="keg-status">' +
            '<span class="tag-offline" hidden>offline</span>' +
            '<span class="dot"></span>' +
            '<span class="keg-temp"></span>' +
          '</span>' +
        '</div>' +
        '<div class="keg-figure dim-offline">' +
          '<div class="keg-litres"><span class="v-litres"></span><small>L left</small></div>' +
          '<div class="keg-low" hidden>Low — under ' + LOW_LITRES + ' L</div>' +
          '<div class="keg-sub v-pour" hidden><span>Last pour</span><span class="v-pour-ml"></span></div>' +
        '</div>' +
        '<div class="keg-tare">' +
          '<div class="lbl"><span>Keg tare (kg) — printed on the keg</span><span class="v-tare"></span></div>' +
          '<div class="row">' +
            '<input class="f-tare" type="number" min="0" step="0.01" inputmode="decimal" />' +
            '<button class="b-tare">Set tare</button>' +
          '</div>' +
        '</div>';

      const path = "/api/kegs/" + encodeURIComponent(id);

      const nameInput = qs(".keg-name", card);
      nameInput.placeholder = shortId(id);
      nameInput.addEventListener("change", async () => {
        try {
          await api(path + "/label", "POST", { value: nameInput.value.trim() });
          toast("Name saved");
        } catch (e) {
          toast(e.message, true);
        }
      });

      const tareInput = qs(".f-tare", card);
      tareInput.addEventListener("input", () => (tareInput.dataset.dirty = "1"));
      const setTare = async () => {
        const v = num(tareInput.value);
        if (v == null || v < 0) return toast("Enter the keg's tare in kg", true);
        const btn = qs(".b-tare", card);
        btn.disabled = true;
        try {
          await api(path + "/empty-keg-weight", "POST", { value: v.toFixed(3) });
          // Until the scale reports again: the same weight, less the new tare.
          const k = kegs.get(id);
          if (k) {
            k.amount_left = (grossKg(k) - v).toFixed(3);
            k.empty_keg_weight = v.toFixed(3);
          }
          delete tareInput.dataset.dirty;
          tareInput.blur();
          toast("Tare set to " + v.toFixed(2) + " kg");
        } catch (e) {
          toast(e.message, true);
        }
        const k = kegs.get(id);
        if (k) updateCard(card, k);
      };
      qs(".b-tare", card).addEventListener("click", setTare);
      tareInput.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") setTare();
      });

      return card;
    }

    /* Fill in a card from a record, leaving alone any field being edited. */
    function updateCard(card, keg) {
      const online = connected.has(keg.id);
      const litres = litresLeft(keg);
      const temp = num(keg.keg_temperature);
      const lastPour = num(keg.last_pour) || 0;
      const low = litres < LOW_LITRES;

      card.classList.toggle("is-offline", !online);
      qs(".tag-offline", card).hidden = online;
      qs(".dot", card).className = "dot " + (!online ? "" : isPouring(keg) ? "pouring" : "online");
      qs(".keg-temp", card).textContent = temp != null ? temp.toFixed(1) + "°C" : "--";

      qs(".v-litres", card).textContent = litres.toFixed(1);
      qs(".keg-litres", card).classList.toggle("low-text", low);
      qs(".keg-low", card).hidden = !low;
      qs(".v-pour", card).hidden = lastPour <= 0;
      qs(".v-pour-ml", card).textContent = Math.round(lastPour * 1000) + " ml";

      const nameInput = qs(".keg-name", card);
      if (document.activeElement !== nameInput) nameInput.value = (keg.my_label || "").trim();

      const tare = tareKg(keg);
      qs(".v-tare", card).textContent = "in effect: " + tare.toFixed(2) + " kg";
      const tareInput = qs(".f-tare", card);
      if (document.activeElement !== tareInput && !tareInput.dataset.dirty) tareInput.value = tare.toFixed(2);
      qs(".b-tare", card).disabled = !online;
    }

    /* Cards are rebuilt only when the set of scales shown changes, so a
       reading that arrives does not wipe what is being typed. */
    function render() {
      const ids = visibleIds();
      const key = ids.join("|");
      if (key !== shown) {
        shown = key;
        grid.className = "serving-grid count-" + ids.length;
        grid.innerHTML = "";
        ids.forEach((id) => grid.appendChild(kegCard(id)));
      }
      [...grid.children].forEach((card) => {
        const keg = kegs.get(card.dataset.kegId);
        if (keg) updateCard(card, keg);
      });
      emptyMsg.hidden = kegs.size > 0;
      renderPickBar();
    }

    async function refresh() {
      try {
        const [list, conn] = await Promise.all([api("/api/kegs"), api("/api/kegs/connected")]);
        kegs = new Map((list || []).map((k) => [k.id, k]));
        connected = new Set(conn || []);
        render();
      } catch (e) {
        toast(e.message, true);
      }
    }

    connectWs((msg) => {
      if (msg.type === "keg_removed") {
        kegs.delete(msg.id);
        connected.delete(msg.id);
        render();
        return;
      }
      if (msg.type) return;
      if (!msg.id) return;
      kegs.set(msg.id, msg);
      trackConnected(connected, msg);
      render();
    });

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
