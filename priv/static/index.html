<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serving</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    .serving-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    @media (min-width: 900px) and (orientation: landscape) {
      .serving-grid.count-2 { grid-template-columns: repeat(2, 1fr); }
      .serving-grid.count-3 { grid-template-columns: repeat(3, 1fr); }
    }
    .keg {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      min-height: 260px;
    }
    .keg-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .keg-name {
      font-size: 1.15rem;
      font-weight: 700;
      background: none;
      border: none;
      color: var(--text);
      padding: 0;
      width: 100%;
    }
    .keg-name::placeholder { color: var(--text-muted); font-weight: 500; }
    .keg-status { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .keg-temp { font-size: 0.9rem; color: var(--text-muted); }
    .keg-figure { margin-top: auto; }
    .keg-litres { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .keg-litres small { font-size: 1rem; font-weight: 600; color: var(--text-muted); margin-left: 0.3rem; }
    .keg-sub { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin: 0.5rem 0 0.35rem; }
    .keg-actions { display: flex; gap: 0.5rem; }
    .keg-actions button { flex: 1; }
    .pick-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .pick-bar .chip {
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .pick-bar .chip.on { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header data-nav="serving"></header>
  <main>
    <div class="pick-bar" id="pickBar" hidden>
      <span class="muted">Show:</span>
    </div>
    <div class="serving-grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No kegs connected yet.</p>
  </main>

  <script src="/app.js"></script>
  <script>
    const MAX_KEGS = 3;
    const grid = qs("#grid");
    const emptyMsg = qs("#empty");
    const pickBar = qs("#pickBar");

    let kegs = new Map();     // id -> keg record
    let connected = [];       // connected ids
    let selection = loadSelection();

    function loadSelection() {
      try {
        const raw = localStorage.getItem("serving.selection");
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }
    function saveSelection() {
      try { localStorage.setItem("serving.selection", JSON.stringify(selection)); } catch (_) {}
    }

    function sortedIds() {
      return [...kegs.values()]
        .sort((a, b) => {
          const ao = a.my_sort_order == null || a.my_sort_order === "" ? 1e9 : parseInt(a.my_sort_order, 10);
          const bo = b.my_sort_order == null || b.my_sort_order === "" ? 1e9 : parseInt(b.my_sort_order, 10);
          if (ao !== bo) return ao - bo;
          return String(a.id).localeCompare(String(b.id));
        })
        .map((k) => k.id);
    }

    function visibleIds() {
      const all = sortedIds();
      if (selection && selection.length) {
        const filtered = all.filter((id) => selection.indexOf(id) !== -1);
        return filtered.slice(0, MAX_KEGS);
      }
      return all.slice(0, MAX_KEGS);
    }

    function renderPickBar() {
      const all = sortedIds();
      pickBar.hidden = all.length <= MAX_KEGS;
      if (pickBar.hidden) return;
      pickBar.querySelectorAll(".chip").forEach((c) => c.remove());
      const vis = visibleIds();
      all.forEach((id) => {
        const k = kegs.get(id);
        const chip = ce("span", "chip" + (vis.indexOf(id) !== -1 ? " on" : ""));
        chip.textContent = (k && k.my_label && k.my_label.trim()) || shortId(id);
        chip.onclick = () => toggleSelection(id);
        pickBar.appendChild(chip);
      });
    }

    function toggleSelection(id) {
      const base = selection && selection.length ? selection.slice() : visibleIds();
      const i = base.indexOf(id);
      if (i !== -1) base.splice(i, 1);
      else base.push(id);
      selection = base;
      saveSelection();
      render();
    }

    function shortId(id) {
      return "Keg " + String(id).slice(0, 4);
    }

    function kegCard(keg) {
      const card = ce("div", "card keg");
      card.dataset.kegId = keg.id;

      const online = connected.indexOf(keg.id) !== -1;
      const pouring = keg.is_pouring && keg.is_pouring !== "0";
      const temp = num(keg.keg_temperature);
      const litres = litresLeft(keg);
      const pct = percentLeft(keg);
      const cap = num(keg.max_keg_volume);
      const lastPour = num(keg.last_pour) || 0;

      card.innerHTML =
        '<div class="keg-top">' +
          '<input class="keg-name" maxlength="40" placeholder="' + esc(shortId(keg.id)) + '" />' +
          '<span class="keg-status">' +
            '<span class="dot ' + (pouring ? "pouring" : online ? "online" : "") + '"></span>' +
            '<span class="keg-temp">' + (temp != null ? temp.toFixed(1) + "°C" : "--") + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="keg-figure">' +
          '<div class="keg-litres">' + litres.toFixed(1) + '<small>L left</small></div>' +
          '<div class="keg-sub"><span>' + pct.toFixed(0) + '% full</span>' +
            (cap ? '<span>of ' + cap.toFixed(1) + ' L</span>' : '') + '</div>' +
          '<div class="bar"><i class="' + (pct < 20 ? "low" : "") + '" style="width:' + pct.toFixed(1) + '%"></i></div>' +
          (lastPour > 0 ? '<div class="keg-sub"><span>Last pour</span><span>' + Math.round(lastPour * 1000) + ' ml</span></div>' : '') +
        '</div>' +
        '<div class="keg-actions">' +
          '<button data-act="tare">Tare</button>' +
        '</div>';

      const nameInput = qs(".keg-name", card);
      nameInput.value = (keg.my_label || "").trim();
      nameInput.addEventListener("change", async () => {
        try {
          await api("/api/kegs/" + encodeURIComponent(keg.id) + "/label", "POST", { value: nameInput.value.trim() });
          toast("Name saved");
        } catch (e) {
          toast(e.message, true);
        }
      });

      qs('[data-act="tare"]', card).addEventListener("click", async (ev) => {
        const btn = ev.currentTarget;
        btn.disabled = true;
        try {
          await api("/api/kegs/" + encodeURIComponent(keg.id) + "/tare", "POST", {});
          setTimeout(() => api("/api/kegs/" + encodeURIComponent(keg.id) + "/tare-release", "POST", {}).catch(() => {}), 600);
          toast("Tared");
        } catch (e) {
          toast(e.message, true);
        } finally {
          setTimeout(() => (btn.disabled = false), 1200);
        }
      });

      return card;
    }

    function render() {
      const ids = visibleIds();
      grid.className = "serving-grid count-" + ids.length;
      grid.innerHTML = "";
      ids.forEach((id) => grid.appendChild(kegCard(kegs.get(id))));
      emptyMsg.hidden = kegs.size > 0;
      renderPickBar();
    }

    async function refresh() {
      try {
        const [list, conn] = await Promise.all([api("/api/kegs"), api("/api/kegs/connected")]);
        kegs = new Map((list || []).map((k) => [k.id, k]));
        connected = conn || [];
        render();
      } catch (e) {
        toast(e.message, true);
      }
    }

    connectWs((msg) => {
      if (msg.type === "keg_removed") {
        kegs.delete(msg.id);
        render();
        return;
      }
      if (msg.type) return;
      if (!msg.id) return;
      kegs.set(msg.id, msg);
      if (connected.indexOf(msg.id) === -1) connected.push(msg.id);
      render();
    });

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
